<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estatísticas dos lutadores | Fight Zone</title><meta name="description" content="Estatísticas dos lutadores do UFC por categoria no Fight Zone."><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/image-fix.css"><style>.stats-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stats-filter{background:#10151b;border:1px solid #252d36;color:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.stats-filter.active{background:#ef2e2e;border-color:#ef2e2e}.stats-card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stats-fighter-card{background:#0c1115;border:1px solid #252c35;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.stats-fighter-card img{width:100%;height:260px;object-fit:cover;object-position:50% 15%;background:#11151b}.stats-fighter-card .body{padding:12px;display:flex;flex-direction:column;flex:1}.stats-fighter-card h3{margin:3px 0}.stats-fighter-card .country{color:#aab2bd;font-size:.78rem}.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.quick-stats div{background:#080c11;border:1px solid #222a34;border-radius:8px;padding:8px 4px;text-align:center}.quick-stats b,.quick-stats small{display:block}.quick-stats b{font-size:.78rem}.quick-stats small{font-size:.55rem;color:#7f8996;text-transform:uppercase;margin-top:3px}.stats-fighter-card .open{margin-top:auto;color:#fff;font-size:.78rem;font-weight:800}@media(max-width:1100px){.stats-card-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.stats-card-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats-card-grid{grid-template-columns:1fr}.stats-fighter-card img{height:360px}}</style></head><body><header class="top"><div class="wrap nav"></div></header><main><section><div class="wrap"><span class="kicker">ESTATÍSTICAS</span><h1>Estatísticas dos lutadores</h1><p class="muted">Agora você pode navegar por todos os lutadores do banco do Fight Zone e abrir as estatísticas completas de cada um.</p><input id="stats-search" class="searchbox" placeholder="Buscar lutador..."><div class="stats-toolbar" id="stats-filters"><button class="stats-filter active" data-key="all">Todos</button><button class="stats-filter" data-key="fly">Peso-mosca</button><button class="stats-filter" data-key="bantam">Peso-galo</button><button class="stats-filter" data-key="feather">Peso-pena</button><button class="stats-filter" data-key="light">Peso-leve</button><button class="stats-filter" data-key="welter">Meio-médio</button><button class="stats-filter" data-key="middle">Peso-médio</button><button class="stats-filter" data-key="lhw">Meio-pesado</button><button class="stats-filter" data-key="heavy">Peso-pesado</button><button class="stats-filter" data-key="women">Feminino</button><button class="stats-filter" data-key="legend">Lendas</button></div><div class="section-head"><h2 id="stats-title">Todos os lutadores</h2><span id="stats-count" class="muted"></span></div><div id="stats-grid" class="stats-card-grid"></div></div></section></main><footer class="footer"><div class="wrap footer-row"><span>© 2026 Fight Zone.</span><span><a href="/about.html">Sobre</a> · <a href="/contact.html">Contato</a> · <a href="/privacy.html">Privacidade</a></span></div></footer><script src="/fighters-data.js"></script><script src="/fighters-extra.js"></script><script src="/app.js"></script><script>(()=>{const grid=document.getElementById('stats-grid'),search=document.getElementById('stats-search'),count=document.getElementById('stats-count'),title=document.getElementById('stats-title');if(!grid||!window.FIGHTERS)return;let key='all';const names={all:'Todos os lutadores',fly:'Peso-mosca',bantam:'Peso-galo',feather:'Peso-pena',light:'Peso-leve',welter:'Meio-médio',middle:'Peso-médio',lhw:'Meio-pesado',heavy:'Peso-pesado',women:'Feminino',legend:'Lendas'};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(card,f){if(card.dataset.loaded)return;card.dataset.loaded='1';try{const d=await(await fetch('/api/fighter-stats?slug='+encodeURIComponent(f.slug)+'&name='+encodeURIComponent(f.name))).json(),s=d.stats||{};card.querySelector('[data-r]').textContent=d.record||'—';card.querySelector('[data-a]').textContent=s.strAcc||'—';card.querySelector('[data-q]').textContent=s.tdAvg||'—'}catch(e){}}function observe(){const cards=[...grid.querySelectorAll('.stats-fighter-card')];if(!('IntersectionObserver'in window)){cards.slice(0,20).forEach(c=>load(c,window.FIGHTERS.find(f=>f.slug===c.dataset.slug)));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const c=e.target,f=window.FIGHTERS.find(x=>x.slug===c.dataset.slug);if(f)load(c,f);io.unobserve(c)}}),{rootMargin:'250px'});cards.forEach(c=>io.observe(c))}function draw(){const q=(search.value||'').trim().toLowerCase();let list=window.FIGHTERS.filter(f=>(key==='all'||f.key===key)&&(!q||f.name.toLowerCase().includes(q)||f.division.toLowerCase().includes(q)));title.textContent=names[key]||'Lutadores';count.textContent=list.length+' atletas';grid.innerHTML=list.map(f=>`<a class="stats-fighter-card" data-slug="${f.slug}" href="/fighter.html?slug=${f.slug}"><img loading="lazy" src="/api/fighter-image?slug=${f.slug}" alt="${esc(f.name)}"><div class="body"><span class="kicker">${esc(f.division)}</span><h3>${esc(f.name)}</h3><span class="country">${esc(f.flag)} ${esc(f.country)}</span><div class="quick-stats"><div><b data-r>…</b><small>Cartel</small></div><div><b data-a>…</b><small>Precisão</small></div><div><b data-q>…</b><small>Quedas</small></div></div><span class="open">Ver estatísticas completas →</span></div></a>`).join('')||'<div class="notice">Nenhum lutador encontrado.</div>';observe()}document.querySelectorAll('.stats-filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.stats-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');key=b.dataset.key;draw()});search.addEventListener('input',draw);draw()})();</script></body></html>
